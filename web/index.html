<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<style>
  :root {
    --bg: #14171c; --panel: #1b1f26; --line: #2a2f38; --text: #d8dce3; --dim: #7c8492; --accent: #7ec8f7;
    --question: #e53935; --busy: #ffd600; --monitoring: #42a5f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 12px 16px 8px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); }
  header .meta { color: var(--dim); font-size: 13px; }
  header .limit b { color: var(--text); font-weight: 600; }
  nav { display: flex; gap: 4px; padding: 0 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim);
    padding: 8px 10px; font: inherit; cursor: pointer; }
  nav button:hover { color: var(--text); }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 8px 16px 24px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: right; color: var(--dim); font-weight: 500; font-size: 12px; padding: 4px 8px; }
  th.l { text-align: left; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.row { border-left: 4px solid transparent; }
  tr.row td:first-child { border-left: 4px solid var(--c, var(--line)); }
  tr.archived td { color: var(--dim); }
  .name { font-weight: 600; cursor: pointer; white-space: nowrap; }
  .name:hover { text-decoration: underline; }
  .state { white-space: nowrap; font-weight: 600; font-size: 13px; }
  .status { color: var(--text); }
  .action { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tfoot td { font-weight: 600; border-bottom: 0; }
  button.small { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 7px; font: inherit; font-size: 12px; cursor: pointer; margin-left: 6px; }
  button.small:hover { border-color: var(--dim); }
  .empty { color: var(--dim); padding: 16px 0; }
  .sec { margin: 18px 0 4px; font-weight: 600; border-left: 4px solid var(--c, var(--line)); padding-left: 8px; }
  .item { display: flex; gap: 8px; padding: 3px 0 3px 12px; }
  .item input { margin-top: 3px; cursor: pointer; }
  .pinned { font-weight: 600; margin: 8px 0; }
  .item.agenda { font-size: 18px; font-weight: 600; padding: 6px 0 6px 12px; }
  .item.old { color: var(--dim); font-weight: 400; }
  .chore { padding: 2px 0 2px 12px; }
  .chore .when { display: inline-block; min-width: 150px; color: var(--dim); }
  .chore.late .when { color: var(--question); }
  .err { color: var(--question); padding: 8px 16px; }
  @media (max-width: 700px) { .action, .hide-s { display: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Cockpit</h1>
  <span class="meta" id="clock"></span>
  <span class="meta limit" id="limits"></span>
</header>
<nav id="tabs"></nav>
<div class="err" id="err" hidden></div>
<main id="main"></main>
<script>
const $ = id => document.getElementById(id)
let data = null
let view = (() => { try { return localStorage.getItem('view') || 'Active' } catch { return 'Active' } })()

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const human = n => n === 0 ? '·' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n)
const heat = (n, i) => n === 0 ? 'var(--dim)' : data.level_colors[data.levels[i].filter(t => n >= t).length]
const time = ts => {
  const d = new Date(ts * 1000), today = new Date().toDateString() === d.toDateString()
  return d.toLocaleString('en-GB', today ? { hour: '2-digit', minute: '2-digit' }
    : { weekday: 'short', hour: '2-digit', minute: '2-digit' })
}

async function post(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Cockpit': '1' },
                                  body: JSON.stringify(body) })
    if (!r.ok) showErr((await r.json()).error || r.statusText)
  } catch (e) { showErr(e.message) }
  load()
}
function showErr(m) { $('err').textContent = m; $('err').hidden = !m }

function setView(v) { view = v; try { localStorage.setItem('view', v) } catch {} ; render() }

function tabs() {
  const views = data.views.filter(v => v !== 'Commands')
  if (!views.includes(view)) view = 'Active'
  const active = data.rows.filter(r => r.running || r.remote).length
  const nTodo = data.todos.sections.reduce((a, s) => a + s.items.length, 0)
  const nAgenda = data.agenda.today ? data.agenda.items.filter(i => !i.done).length : 0
  $('tabs').innerHTML = views.map(v => `<button class="${v === view ? 'on' : ''}" data-v="${esc(v)}">${esc(v)}${
    v === 'Active' ? ` (${active})` : v === 'To-dos' ? ` (${nTodo})` : v === 'Agenda' ? ` (${nAgenda})` : ''}</button>`).join('')
  return views
}

function stateCell(r) {
  if (r.state === 'question')
    return `<span style="color:var(--question)">❓ question</span><button class="small" data-dismiss="${esc(r.name)}">dismiss</button>`
  if (r.state) return `<span style="color:${data.states[r.state]}">${r.state}</span>`
  if (r.remote) return `<span style="color:${data.states[r.remote.state] || 'var(--dim)'}" title="${esc(r.remote.state)} on ${esc(r.remote.host)}">@${esc(r.remote.host)}</span>`
  return ''
}

function rowsView() {
  let rows = view === 'Active' ? data.rows.filter(r => r.running || r.remote)
    : data.rows.filter(r => r.category === view).sort((a, b) => a.archived - b.archived)
  if (!rows.length) return `<div class="empty">no running sessions</div>`
  const tot = [0, 0, 0]
  const body = rows.map(r => {
    r.tokens.forEach((n, i) => tot[i] += n)
    return `<tr class="row ${r.archived ? 'archived' : ''}" style="--c:${r.color || 'var(--line)'}">
      <td><span class="name" data-open="${esc(r.name)}" title="go to its tab${r.resumable ? ' (resumes the asking session)' : ''}">${esc(r.name)}</span></td>
      <td class="state">${stateCell(r)}</td>
      <td class="status">${esc(r.status)}</td>
      <td class="action hide-s">${esc(r.action)}</td>
      ${r.tokens.map((n, i) => `<td class="num" style="color:${heat(n, i)}">${human(n)}</td>`).join('')}
    </tr>`
  }).join('')
  return `<table>
    <thead><tr><th class="l">project</th><th class="l">state</th><th class="l">status</th><th class="l hide-s">last action</th>
      <th>5h</th><th>7d</th><th>all</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td>total</td><td></td><td class="action" colspan="2">tokens, all machines (input + cache writes + output)</td>
      ${tot.map(n => `<td class="num">${human(n)}</td>`).join('')}</tr></tfoot>
  </table>`
}

function todoView() {
  const t = data.todos, today = new Date(new Date().toDateString())
  let h = t.pinned.map(p => `<div class="pinned">${esc(p)}</div>`).join('')
  if (t.chores.length) {
    h += `<div class="sec" style="--c:var(--monitoring)">Chores due</div>` + t.chores.map(c => {
      const d = Math.round((new Date(c.due) - today) / 864e5)
      const when = d === 0 ? 'today' : d < 0 ? `${-d}d overdue` : `in ${d}d`
      return `<div class="chore ${d < 0 ? 'late' : ''}"><span class="when">${esc(c.due)} ${when}</span>${esc(c.chore)} <span class="action">${esc(c.project)}</span></div>`
    }).join('')
  }
  h += t.sections.map(s => `<div class="sec" style="--c:${s.color || 'var(--line)'}">${esc(s.name)}</div>` +
    s.items.map(i => `<label class="item"><input type="checkbox" data-tick="${i.index}" data-text="${esc(i.text)}"><span>${esc(i.plain)}</span></label>`).join('')).join('')
  return h || `<div class="empty">nothing to do</div>`
}

function agendaView() {
  const a = data.agenda
  let h = a.today ? '' : `<div class="pinned" style="color:var(--question)">no agenda for today yet</div>
    <div class="action">set it: todo agenda &lt;item&gt;, &lt;item&gt;, …</div>${a.day ? `<div class="sec">last one, ${esc(a.day)}</div>` : ''}`
  h += a.items.map(i => `<label class="item agenda ${a.today && !i.done ? '' : 'old'}"><input type="checkbox" ${i.done ? 'checked' : ''} ${a.today && !i.done ? '' : 'disabled'}
    data-tick="${i.index}" data-text="${esc(i.text)}" data-file="agenda"><span>${esc(i.text)}</span></label>`).join('')
  return h
}

function render() {
  if (!data) return
  document.title = `${data.name} · cockpit`
  $('title').textContent = data.name
  $('clock').textContent = new Date(data.time * 1000).toLocaleString('sv-SE').slice(0, 16)
  $('limits').innerHTML = Object.entries(data.limits).map(([k, v]) =>
    `<span>${k} <b>${v.percent ?? '?'}%</b> ↻ ${time(v.resets)}</span>`).join(' &nbsp; ')
  tabs()
  $('main').innerHTML = view === 'To-dos' ? todoView() : view === 'Agenda' ? agendaView() : rowsView()
}

document.addEventListener('click', e => {
  const t = e.target
  if (t.dataset.v) setView(t.dataset.v)
  else if (t.dataset.open) post('/api/open', { project: t.dataset.open })
  else if (t.dataset.dismiss) post('/api/dismiss', { project: t.dataset.dismiss })
  else if (t.dataset.tick) { t.disabled = true; post('/api/tick', { index: +t.dataset.tick, text: t.dataset.text, file: t.dataset.file }) }
})
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || !data) return
  e.preventDefault()
  const views = data.views.filter(v => v !== 'Commands'), i = views.indexOf(view)
  setView(views[(i + (e.shiftKey ? -1 : 1) + views.length) % views.length])
})

async function load() {
  try {
    const r = await fetch('/api/state')
    data = await r.json(); showErr(''); render()
  } catch (e) { showErr('cockpit-web not reachable: ' + e.message) }
}
load(); setInterval(load, 2000)
</script>
</body>
</html>
